openapi: 3.0.3
info:
  title: ZOYD API
  version: 1.0.0
  description: API for ZOYD competitive gaming platform — wagers, tournaments, leagues, and wallets.

servers:
  - url: https://zoyd.onrender.com
    description: Production
  - url: http://localhost:4001
    description: Local development

paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy

  /api/auth/register:
    post:
      summary: Register a new account
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [pseudo, email, phone, password, gameId, controllerType, device, country]
              properties:
                pseudo: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                password: { type: string, minLength: 8 }
                gameId: { type: string }
                controllerType: { type: string, enum: [touch, controller, emulator, pc, other] }
                device: { type: string }
                country: { type: string }
      responses:
        '201': { description: Account created }
        '409': { description: Email/pseudo already taken }

  /api/auth/login:
    post:
      summary: Login with identifier + password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, description: Email or pseudo }
                password: { type: string }
      responses:
        '200': { description: Login successful, returns token + user }
        '401': { description: Invalid credentials }

  /api/auth/me:
    get:
      summary: Get current user profile
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Current user }
        '401': { description: Not authenticated }

  /api/wallet/me:
    get:
      summary: Get wallet snapshot
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Wallet balance + transactions }

  /api/wallet/deposit:
    post:
      summary: Deposit funds
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [amount, method]
              properties:
                amount: { type: number }
                method: { type: string }
      responses:
        '200': { description: Deposit confirmed }

  /api/wallet/withdraw:
    post:
      summary: Withdraw funds
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [amount, method, phone]
              properties:
                amount: { type: number }
                method: { type: string }
                phone: { type: string }
      responses:
        '200': { description: Withdrawal confirmed }

  /api/matches:
    get:
      summary: List all public matches
      responses:
        '200': { description: Match list }
    post:
      summary: Create a new match
      security: [{ BearerAuth: [] }]
      responses:
        '201': { description: Match created }

  /api/matches/{matchId}/join:
    post:
      summary: Join a match
      security: [{ BearerAuth: [] }]
      parameters:
        - name: matchId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Joined successfully }

  /api/matches/{matchId}/result:
    post:
      summary: Submit match result
      security: [{ BearerAuth: [] }]
      parameters:
        - name: matchId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Result submitted }

  /api/admin/matches/{matchId}/award:
    post:
      summary: Admin: award match result
      security: [{ BearerAuth: [] }]
      parameters:
        - name: matchId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Match awarded }
        '403': { description: Admin only }

  /api/admin/2fa/verify:
    post:
      summary: Admin: verify 2FA code
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200': { description: 2FA verified }
        '400': { description: Invalid code }

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID
