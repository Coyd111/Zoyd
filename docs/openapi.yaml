openapi: 3.1.0
info:
  title: ZOYD Gaming Platform REST API
  description: API REST du plateau de jeu ZOYD — Multijoueur, Tournois, Ligues Battle Royale, Chat et Notifications.
  version: 1.0.0
  contact:
    name: ZOYD Team
    url: https://zoyd.africa

servers:
  - url: http://localhost:4001
    description: Serveur de développement
  - url: https://zoyd.africa
    description: Production

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: Authentification, inscription, profil et gestion de session.
  - name: Social
    description: Gestion des amis, demandes, blocage.
  - name: Notifications
    description: Notifications utilisateur (lecture).
  - name: Leaderboard
    description: Classement global des joueurs.
  - name: Wallet
    description: Portefeuille, dépôts, retraits et vérification FedaPay.
  - name: Matches
    description: Création, gestion et résolution des matchs multijoueur.
  - name: Tournaments
    description: Tournois — création, inscription, déroulement et résultats.
  - name: Leagues
    description: Ligues Battle Royale — saisons, journées, qualifications et finales.
  - name: Admin
    description: Actions d'administration sur les matchs.
  - name: Chat
    description: Canaux de discussion, messages et marquer lu.
  - name: Realtime
    description: Santé du serveur, sessions temps réel, abonnements push et synchronisation d'état.
  - name: Users
    description: Recherche d'utilisateurs.

paths:
  # ─── Auth ──────────────────────────────────────────────────────────────────
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Inscription d'un nouveau compte joueur
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Compte créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: Données d'inscription invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Pseudo, email, téléphone ou Game ID déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Trop de requêtes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Connexion au compte joueur
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Identifiants incorrects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Trop de requêtes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Récupérer le profil de la session courante
      operationId: getMe
      responses:
        '200':
          description: Profil utilisateur retourné
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags: [Auth]
      summary: Mettre à jour le profil (champs autorisés uniquement)
      description: |
        Whitelist stricte — empêche l'escalade de rôle (mass assignment).
        Champs modifiables : pseudo, avatar, bio, device, controllerType,
        country, streamerMode, streamerPseudo, notifications, phone,
        levelCODM, rankMJ, rankBR.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Déconnexion (détruit la session applicative et les sessions temps réel)
      operationId: logoutUser
      responses:
        '200':
          description: Déconnexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Changer le mot de passe
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Mot de passe changé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: Mot de passe trop court ou champs manquants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Mot de passe actuel incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Utilisateur introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Social ────────────────────────────────────────────────────────────────
  /api/social/request:
    post:
      tags: [Social]
      summary: Envoyer une demande d'ami
      operationId: sendFriendRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialTargetRequest'
      responses:
        '200':
          description: Demande envoyée
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request:
                    $ref: '#/components/schemas/FriendRequest'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflit (déjà amis, auto-demande, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/social/accept:
    post:
      tags: [Social]
      summary: Accepter une demande d'ami
      operationId: acceptFriendRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialRequestRequest'
      responses:
        '200':
          description: Demande acceptée
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  friend:
                    $ref: '#/components/schemas/FriendProfile'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/social/decline:
    post:
      tags: [Social]
      summary: Refuser une demande d'ami
      operationId: declineFriendRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialRequestRequest'
      responses:
        '200':
          description: Demande refusée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/social/friends/{id}:
    delete:
      tags: [Social]
      summary: Supprimer un ami
      operationId: removeFriend
      parameters:
        - $ref: '#/components/parameters/FriendId'
      responses:
        '200':
          description: Ami supprimé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/social/block:
    post:
      tags: [Social]
      summary: Bloquer un utilisateur
      operationId: blockUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialTargetRequest'
      responses:
        '200':
          description: Utilisateur bloqué
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/social/unblock:
    post:
      tags: [Social]
      summary: Débloquer un utilisateur
      operationId: unblockUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialTargetRequest'
      responses:
        '200':
          description: Utilisateur débloqué
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Notifications ─────────────────────────────────────────────────────────
  /api/notifications/read:
    post:
      tags: [Notifications]
      summary: Marquer une notification comme lue
      operationId: markNotificationRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationReadRequest'
      responses:
        '200':
          description: Notification marquée lue
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  success:
                    type: boolean
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Marquer toutes les notifications comme lues
      operationId: markAllNotificationsRead
      responses:
        '200':
          description: Toutes les notifications marquées lues
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  changes:
                    description: Nombre de notifications mises à jour
                    type: integer
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Leaderboard ───────────────────────────────────────────────────────────
  /api/leaderboard:
    get:
      tags: [Leaderboard]
      summary: Récupérer le classement global
      description: Retourne tous les joueurs ayant au moins 1 match ou des gains, triés par ELO décroissant.
      operationId: getLeaderboard
      security: []
      responses:
        '200':
          description: Classement retourné
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  players:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeaderboardEntry'
        '500':
          description: Erreur lors du chargement du classement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Wallet ────────────────────────────────────────────────────────────────
  /api/wallet/me:
    get:
      tags: [Wallet]
      summary: Récupérer le portefeuille et le profil utilisateur
      operationId: getMyWallet
      responses:
        '200':
          description: Portefeuille et utilisateur retournés
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  wallet:
                    $ref: '#/components/schemas/Wallet'
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/wallet/deposit:
    post:
      tags: [Wallet]
      summary: Effectuer un dépôt
      operationId: depositToWallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
      responses:
        '200':
          description: Dépôt effectué
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  wallet:
                    $ref: '#/components/schemas/Wallet'
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Montant invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/wallet/withdraw:
    post:
      tags: [Wallet]
      summary: Effectuer un retrait
      operationId: withdrawFromWallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
      responses:
        '200':
          description: Retrait effectué
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  wallet:
                    $ref: '#/components/schemas/Wallet'
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Montant invalide ou retrait minimum non atteint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Fonds insuffisants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/wallet/verify-fedapay:
    post:
      tags: [Wallet]
      summary: Vérifier une transaction FedaPay et créditer le portefeuille
      operationId: verifyFedaPayTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyFedaPayRequest'
      responses:
        '200':
          description: Transaction vérifiée et portefeuille crédité
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  amount:
                    type: number
                    description: Montant crédité en ZC
                  wallet:
                    $ref: '#/components/schemas/Wallet'
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: transactionId manquant ou transaction invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Matches ───────────────────────────────────────────────────────────────
  /api/matches:
    get:
      tags: [Matches]
      summary: Lister les matchs visibles
      description: >
        Filtre les matchs côté serveur selon le type d'appareil de l'utilisateur connecté.
        Si aucun token n'est fourni, tous les matchs publics sont retournés.
      operationId: listMatches
      security: []
      responses:
        '200':
          description: Liste des matchs retournée
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  matches:
                    type: array
                    items:
                      $ref: '#/components/schemas/Match'

    post:
      tags: [Matches]
      summary: Créer un nouveau match
      operationId: createMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMatchRequest'
      responses:
        '201':
          description: Match créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchActionResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/matches/{id}/join:
    post:
      tags: [Matches]
      summary: Rejoindre un match
      operationId: joinMatch
      parameters:
        - $ref: '#/components/parameters/MatchId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                team:
                  type: integer
                  description: Numéro d'équipe (0 ou 1)
      responses:
        '200':
          description: Match rejoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchActionResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Place déjà prise, déjà rejoint, ou match fermé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/matches/{id}/arbiter:
    post:
      tags: [Matches]
      summary: S'assigner comme arbitre d'un match
      operationId: assignArbiter
      parameters:
        - $ref: '#/components/parameters/MatchId'
      responses:
        '200':
          description: Arbitre assigné
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchActionResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Arbitre déjà assigné ou conflit de rôle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/matches/{id}/check-in:
    post:
      tags: [Matches]
      summary: Enregistrer le check-in d'un joueur
      operationId: checkInMatch
      parameters:
        - $ref: '#/components/parameters/MatchId'
      responses:
        '200':
          description: Check-in effectué
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchActionResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/matches/{id}/ready:
    post:
      tags: [Matches]
      summary: Basculer le statut prêt / pas prêt
      operationId: toggleReady
      parameters:
        - $ref: '#/components/parameters/MatchId'
      responses:
        '200':
          description: Statut prêt mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchActionResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/matches/{id}/schedule:
    post:
      tags: [Matches]
      summary: Planifier la date/heure du match
      operationId: scheduleMatch
      parameters:
        - $ref: '#/components/parameters/MatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduledAt:
                  type: string
                  format: date-time
                  description: Date et heure prévues du match (ISO 8601)
      responses:
        '200':
          description: Match planifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchActionResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/matches/{id}/room:
    post:
      tags: [Matches]
      summary: Définir les détails de la salle de jeu
      operationId: setMatchRoom
      parameters:
        - $ref: '#/components/parameters/MatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomDetailsRequest'
      responses:
        '200':
          description: Salle configurée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchActionResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/matches/{id}/launch:
    post:
      tags: [Matches]
      summary: Lancer le match
      operationId: launchMatch
      parameters:
        - $ref: '#/components/parameters/MatchId'
      responses:
        '200':
          description: Match lancé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchActionResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/matches/{id}/result:
    post:
      tags: [Matches]
      summary: Soumettre le résultat d'un match
      operationId: submitMatchResult
      parameters:
        - $ref: '#/components/parameters/MatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchResultRequest'
      responses:
        '200':
          description: Résultat soumis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchActionResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/matches/{id}/confirm:
    post:
      tags: [Matches]
      summary: Confirmer le résultat d'un match
      operationId: confirmMatchResult
      parameters:
        - $ref: '#/components/parameters/MatchId'
      responses:
        '200':
          description: Résultat confirmé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchActionResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/matches/{id}/disputes:
    post:
      tags: [Matches]
      summary: Ouvrir un litige sur un match
      operationId: openDispute
      parameters:
        - $ref: '#/components/parameters/MatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeRequest'
      responses:
        '200':
          description: Litige ouvert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchActionResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Litige déjà ouvert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/matches/{id}/dispute/evidence:
    post:
      tags: [Matches]
      summary: Ajouter une preuve au litige
      operationId: addDisputeEvidence
      parameters:
        - $ref: '#/components/parameters/MatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                evidence:
                  description: Preuve(s) à joindre (URL, texte, etc.)
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
      responses:
        '200':
          description: Preuve ajoutée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchActionResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/matches/{id}/dispute/escalate:
    post:
      tags: [Matches]
      summary: Escalader un litige au niveau admin
      operationId: escalateDispute
      parameters:
        - $ref: '#/components/parameters/MatchId'
      responses:
        '200':
          description: Litige escaladé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchActionResponse'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Tournaments ───────────────────────────────────────────────────────────
  /api/tournaments:
    get:
