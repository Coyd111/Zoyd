      description: >
        Anciennement utilisé pour synchroniser les tournois. Désormais les tournois
        sont gérés par les routes dédiées. Retourne 409 si kind=tournaments.
      operationId: stateSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateSyncRequest'
      responses:
        '400':
          description: Payload de synchronisation invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Realtime session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Tournament state is now managed by dedicated API routes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/realtime/push/subscribe:
    post:
      tags: [Realtime]
      summary: S'abonner aux notifications push
      operationId: subscribePush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscribeRequest'
      responses:
        '200':
          description: Abonnement enregistré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: Endpoint manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Realtime session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/realtime/push/unsubscribe:
    post:
      tags: [Realtime]
      summary: Se désabonner des notifications push
      operationId: unsubscribePush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushUnsubscribeRequest'
      responses:
        '200':
          description: Désabonnement effectué
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: Endpoint manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Realtime session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/realtime/push/test:
    post:
      tags: [Realtime]
      summary: Envoyer une notification push de test
      operationId: sendTestPush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTestRequest'
      responses:
        '200':
          description: Notification de test envoyée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          description: Realtime session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Impossible d'envoyer la notification de test
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─── Users ─────────────────────────────────────────────────────────────────
  /api/users/search:
    get:
      tags: [Users]
      summary: Rechercher des utilisateurs par pseudo
      operationId: searchUsers
      parameters:
        - name: q
          in: query
          description: Terme de recherche (pseudo)
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Utilisateurs correspondants
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserPublicProfile'
        '401':
          description: Session joueur requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

# ─── Components ──────────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        Token de session applicative (Bearer). Obtenu via /api/auth/register
        ou /api/auth/login. Certains endpoints publics ne nécessitent pas
        d'authentification.

  parameters:
    MatchId:
      name: id
      in: path
      required: true
      description: Identifiant du match
      schema:
        type: string
    TournamentId:
      name: id
      in: path
      required: true
      description: Identifiant du tournoi
      schema:
        type: string
    TournamentMatchId:
      name: matchId
      in: path
      required: true
      description: Identifiant du match dans le tournoi
      schema:
        type: string
    LeagueId:
      name: id
      in: path
      required: true
      description: Identifiant de la saison de ligue
      schema:
        type: string
    LeagueDayId:
      name: dayId
      in: path
      required: true
      description: Identifiant de la journée de qualification
      schema:
        type: string
    FriendId:
      name: id
      in: path
      required: true
      description: Identifiant de l'ami à supprimer
      schema:
        type: string
    ChannelId:
      name: id
      in: path
      required: true
      description: Identifiant du canal de discussion
      schema:
        type: string
    PlayerId:
      name: playerId
      in: path
      required: true
      description: Identifiant du joueur
      schema:
        type: string

  schemas:
    # ── Réponses génériques ──────────────────────────────────────────────────
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string
          description: Message d'erreur

    # ── Auth ─────────────────────────────────────────────────────────────────
    RegisterRequest:
      type: object
      description: Corps de la requête d'inscription (passé à createUserAccount)
      additionalProperties: true

    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
          description: Pseudo, email ou numéro de téléphone
        password:
          type: string
          description: Mot de passe en clair
      required: [identifier, password]

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          description: Mot de passe actuel
        newPassword:
          type: string
          minLength: 8
          description: Nouveau mot de passe (minimum 8 caractères)
      required: [currentPassword, newPassword]

    UpdateProfileRequest:
      type: object
      description: |
        Champs autorisés : pseudo, avatar, bio, device, controllerType,
        country, streamerMode, streamerPseudo, notifications, phone,
        levelCODM, rankMJ, rankBR.
      properties:
        pseudo:
          type: string
        avatar:
          type: string
        bio:
          type: string
        device:
          type: string
        controllerType:
          type: string
        country:
          type: string
        streamerMode:
          type: boolean
        streamerPseudo:
          type: string
        notifications:
          type: object
        phone:
          type: string
        levelCODM:
          type: string
        rankMJ:
          type: string
        rankBR:
          type: string

    AuthSessionResponse:
      type: object
      properties:
        ok:
          type: boolean
        token:
          type: string
          description: Token de session applicative (Bearer)
        user:
          $ref: '#/components/schemas/User'
        expiresAt:
          type: string
          format: date-time
          description: Date d'expiration de la session

    MeResponse:
      type: object
      properties:
        ok:
          type: boolean
        user:
          $ref: '#/components/schemas/User'
        expiresAt:
          type: string
          format: date-time

    UserResponse:
      type: object
      properties:
        ok:
          type: boolean
        user:
          $ref: '#/components/schemas/User'

    # ── User ─────────────────────────────────────────────────────────────────
    User:
      type: object
      description: Objet utilisateur complet (profil, stats, portefeuille)
      properties:
        id:
          type: string
        pseudo:
          type: string
        email:
          type: string
        phone:
          type: string
        avatar:
          type: string
        bio:
          type: string
        country:
          type: string
        role:
          type: string
          enum: [player, admin]
        device:
          type: string
        controllerType:
          type: string
        levelCODM:
          type: string
        rankMJ:
          type: string
        rankBR:
          type: string
        streamerMode:
          type: boolean
        streamerPseudo:
          type: string
        trustScore:
          type: number
        isOnline:
          type: boolean
        stats:
          $ref: '#/components/schemas/UserStats'
        wallet:
          $ref: '#/components/schemas/Wallet'
        createdAt:
          type: string
          format: date-time

    UserStats:
      type: object
      properties:
        elo:
          type: number
        winRate:
          type: number
        totalMatches:
          type: integer
        totalEarnings:
          type: number
        wins:
          type: integer

    UserPublicProfile:
      type: object
      description: Profil public d'un utilisateur (recherche)
      properties:
        id:
          type: string
        pseudo:
          type: string
        avatar:
          type: string
        country:
          type: string
        trustScore:
          type: number
        controllerType:
          type: string
        isOnline:
          type: boolean

    # ── Social ───────────────────────────────────────────────────────────────
    SocialTargetRequest:
      type: object
      properties:
        targetId:
          type: string
          description: ID de l'utilisateur cible
      required: [targetId]

    SocialRequestRequest:
      type: object
      properties:
        requestId:
          type: string
          description: ID de la demande d'ami
      required: [requestId]

    FriendRequest:
      type: object
      properties:
        id:
          type: string
        fromUserId:
          type: string
        toUserId:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [pending, accepted, declined]
        createdAt:
          type: string
          format: date-time

    FriendProfile:
      type: object
      properties:
        id:
          type: string
        pseudo:
          type: string

    # ── Notifications ────────────────────────────────────────────────────────
    NotificationReadRequest:
      type: object
      properties:
        notificationId:
          type: string
          description: ID de la notification à marquer lue
      required: [notificationId]

    # ── Leaderboard ──────────────────────────────────────────────────────────
    LeaderboardEntry:
      type: object
      properties:
        id:
          type: string
        pseudo:
          type: string
        country:
          type: string
        elo:
          type: number
          description: Score ELO du joueur
        winRate:
          type: number
          description: Taux de victoire (0-1)
        totalMatches:
          type: integer
        totalEarnings:
          type: number
        wins:
          type: integer
        trustScore:
          type: number
        controllerType:
          type: string
        rankMJ:
          type: string
        isOnline:
          type: boolean

    # ── Wallet ───────────────────────────────────────────────────────────────
    Wallet:
      type: object
      description: Portefeuille du joueur
      properties:
        balance:
          type: number
          description: Solde actuel en ZC
        pendingWithdrawal:
          type: number
          description: Montant en attente de retrait
        totalDeposited:
          type: number
        totalWithdrawn:
          type: number

    DepositRequest:
      type: object
      properties:
        amount:
          type: number
          description: Montant du dépôt
        method:
          type: string
          description: Méthode de dépôt
      required: [amount, method]

    WithdrawRequest:
      type: object
      properties:
        amount:
          type: number
          description: Montant du retrait
        method:
          type: string
          description: Méthode de retrait
        phone:
          type: string
          description: Numéro de téléphone (pour Mobile Money)
      required: [amount, method]

    VerifyFedaPayRequest:
      type: object
      properties:
        transactionId:
          type: string
          description: ID de la transaction FedaPay
      required: [transactionId]

    # ── Matches ──────────────────────────────────────────────────────────────
    Match:
      type: object
      description: Objet match
      properties:
        id:
          type: string
        name:
          type: string
        game:
          type: string
        mode:
          type: string
        visibility:
          type: string
          enum: [public, private]
        status:
          type: string
          description: Statut du match (waiting, lobby, live, completed, cancelled, etc.)
        stake:
          type: number
          description: Mise en ZC
        entryFee:
          type: number
        maxPlayers:
          type: integer
        players:
          type: array
          items:
            $ref: '#/components/schemas/MatchPlayer'
        arbiter:
          type: object
          nullable: true
        teams:
          type: array
          items:
            type: object
        result:
          type: object
          nullable: true
        dispute:
          type: object
          nullable: true
        roomName:
          type: string
        roomPassword:
          type: string
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        channelId:
          type: string
        chatChannelId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MatchPlayer:
      type: object
      properties:
        userId:
          type: string
        pseudo:
          type: string
        team:
          type: integer
        isCheckedIn:
          type: boolean
        isReady:
          type: boolean

    MatchActionResponse:
      type: object
      description: Réponse standard après une action sur un match
      properties:
        ok:
          type: boolean
        match:
          $ref: '#/components/schemas/Match'
        user:
          $ref: '#/components/schemas/User'
        wallet:
          $ref: '#/components/schemas/Wallet'

    CreateMatchRequest:
      type: object
      description: Corps de la requête de création de match (passé à createMatchOnServer)
      additionalProperties: true

    MatchResultRequest:
      type: object
      description: Résultat soumis pour un match
      properties:
        winnerTeam:
          type: integer
          description: Numéro de l'équipe gagnante (0 ou 1)
        scores:
          type: object
          properties:
            team0:
              type: integer
            team1:
              type: integer
        screenshots:
          type: array
          items:
            type: string
          description: URLs des captures d'écran
        proofs:
          type: object
          nullable: true
        arbiterNotes:
          type: string
          description: Notes de l'arbitre

    DisputeRequest:
      type: object
      description: Données pour ouvrir un litige
      properties:
        reason:
          type: string
          description: Raison du litige
        proofs:
          type: object
          nullable: true

    RoomDetailsRequest:
      type: object
      properties:
        roomName:
          type: string
          description: Nom de la salle de jeu
        roomPassword:
          type: string
          description: Mot de passe de la salle
      required: [roomName, roomPassword]

    # ── Tournaments ──────────────────────────────────────────────────────────
    Tournament:
      type: object
      description: Objet tournoi
      properties:
        id:
          type: string
        name:
          type: string
        game:
          type: string
        mode:
          type: string
        status:
          type: string
        maxTeams:
          type: integer
        teamSize:
          type: integer
        stake:
          type: number
        entryFee:
          type: number
        prizePool:
          type: number
        entries:
          type: array
          items:
            type: object
        bracket:
          type: object
          nullable: true
        matches:
          type: array
          items:
            type: object
        arbiter:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TournamentActionResponse:
      type: object
      description: Réponse standard après une action sur un tournoi
      properties:
        ok:
          type: boolean
        tournament:
          $ref: '#/components/schemas/Tournament'
        user:
          $ref: '#/components/schemas/User'
        wallet:
          $ref: '#/components/schemas/Wallet'

    CreateTournamentRequest:
      type: object
      description: Corps de la requête de création de tournoi
      additionalProperties: true

    TournamentRegisterRequest:
      type: object
      description: Données d'inscription au tournoi
      additionalProperties: true

    # ── Leagues (BR) ─────────────────────────────────────────────────────────
    LeagueSeason:
      type: object
      description: Saison de ligue Battle Royale
      properties:
        id:
          type: string
        name:
          type: string
        game:
          type: string
        mode:
          type: string
        status:
          type: string
        maxPlayers:
          type: integer
        entryFee:
          type: number
        prizePool:
          type: number
        players:
          type: array
          items:
            type: object
        days:
          type: array
          items:
            type: object
        final:
          type: object
          nullable: true
        settings:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LeagueActionResponse:
      type: object
      description: Réponse standard après une action sur une ligue
      properties:
        ok:
          type: boolean
        season:
          $ref: '#/components/schemas/LeagueSeason'
        user:
          $ref: '#/components/schemas/User'
        wallet:
          $ref: '#/components/schemas/Wallet'

    CreateLeagueSeasonRequest:
      type: object
      description: Corps de la requête de création de saison de ligue
      additionalProperties: true

    LeagueSettingsRequest:
      type: object
      description: Paramètres modifiables de la saison de ligue
      additionalProperties: true

    LeagueReassignRequest:
      type: object
      properties:
        userId:
          type: string
          description: ID du joueur à réaffecter
        fromDay:
          type: string
          description: ID de la journée source
        toDay:
          type: string
          description: ID de la journée cible
      required: [userId, fromDay, toDay]

    # ── Admin ────────────────────────────────────────────────────────────────
    AdminAwardRequest:
      type: object
      properties:
        winnerTeam:
          type: integer
          description: Numéro de l'équipe gagnante (0 ou 1)
        arbiterNotes:
          type: string
          description: Notes de l'admin
      required: [winnerTeam]

    AdminResolveDisputeRequest:
      type: object
      properties:
        resolution:
          type: string
          description: Décision de résolution du litige
          default: Litige clos par moderation.

    AdminCancelRequest:
      type: object
      properties:
        reason:
          type: string
          description: Raison de l'annulation
          default: Match annule par moderation.

    # ── Chat ─────────────────────────────────────────────────────────────────
    ChatBootstrapResponse:
      type: object
      properties:
        ok:
          type: boolean
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ChatChannel'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'

    ChatChannel:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          description: Type de canal (global, match, private, team)
        name:
          type: string
        participants:
          type: array
          items:
            type: string
        scope:
          type: string
          description: Portée du canal (public, participants)
        inbox:
          type: string
        unreadCount:
          type: integer
          description: Nombre de messages non lus
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ChatMessage:
      type: object
      properties:
        id:
          type: string
        channelId:
          type: string
        channelType:
          type: string
        senderId:
          type: string
        senderPseudo:
          type: string
        text:
          type: string
        replyTo:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time

    CreateChatChannelRequest:
      type: object
      properties:
        id:
          type: string
          description: ID du canal (auto-généré si absent)
        type:
          type: string
          description: Type de canal (private, team, match)
          default: private
        name:
          type: string
          description: Nom du canal
          default: Nouvelle conversation
        participants:
          type: array
          description: IDs des participants (l'utilisateur courant est ajouté automatiquement)
          items:
            type: string

    CreateChatChannelResponse:
      type: object
      properties:
        ok:
          type: boolean
        channel:
          $ref: '#/components/schemas/ChatChannel'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'

    SendChatMessageRequest:
      type: object
      properties:
        text:
          type: string
          description: Contenu du message (ne peut pas être vide)
        replyTo:
          type: string
          description: ID du message auquel on répond
      required: [text]

    SendChatMessageResponse:
      type: object
      properties:
        ok:
          type: boolean
        channel:
          $ref: '#/components/schemas/ChatChannel'
        message:
          $ref: '#/components/schemas/ChatMessage'

    ChatReadReceipt:
      type: object
      properties:
        ok:
          type: boolean
        channelId:
          type: string
        userId:
          type: string
        readAt:
          type: string
          format: date-time

    # ── Realtime ─────────────────────────────────────────────────────────────
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        service:
          type: string
          example: zoyd-realtime
        channels:
          type: integer
          description: Nombre de canaux Socket.IO actifs
        subscriptions:
          type: integer
          description: Nombre d'abonnements push enregistrés
        storedMatches:
          type: integer
          description: Nombre de matchs en mémoire
        storedTournaments:
          type: integer
          description: Nombre de tournois en mémoire
        timestamp:
          type: string
          format: date-time

    RealtimeSession:
      type: object
      properties:
        userId:
          type: string
        pseudo:
          type: string
        role:
          type: string
        token:
          type: string
          description: Token de session temps réel (pour Socket.IO)
        createdAt:
          type: string
          format: date-time

    StateSyncRequest:
      type: object
      description: Données de synchronisation d'état
      properties:
        kind:
          type: string
          description: Type d'état à synchroniser
      required: [kind]

    PushSubscribeRequest:
      type: object
      properties:
        subscription:
          type: object
          description: Objet PushSubscription (Web Push API)
          properties:
            endpoint:
              type: string
              description: URL de l'endpoint push
            keys:
              type: object
              properties:
                p256dh:
                  type: string
                auth:
                  type: string
          required: [endpoint]
      required: [subscription]

    PushUnsubscribeRequest:
      type: object
      properties:
        endpoint:
          type: string
          description: URL de l'endpoint push à supprimer
      required: [endpoint]

    PushTestRequest:
      type: object
      properties:
        title:
          type: string
          description: Titre de la notification de test
          default: ZOYD
        body:
          type: string
          description: Corps du message
          default: Notification de test ZOYD
        url:
          type: string
          description: URL de destination au clic
          default: /mj
        tag:
          type: string
          description: Tag de la notification
