
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="La plateforme de référence pour les compétiteurs de Call of Duty Mobile en Afrique." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ZOYD — Plateforme CODM Afrique</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo icone.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <style>html, body { height: 100%; margin: 0; background:#000; } #root { height: 100%; }</style>
  </head>

  <body>
    <div id="root"></div>
    <script src="https://checkout.fedapay.com/js/checkout.js"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('[SW] Registered', reg.scope))
            .catch((err) => console.error('[SW] Registration failed', err));
        });
      }
    </script>
  </body>
</html>
