services:
  - type: web
    name: zoyd-backend
    env: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile --config.node-linker=hoisted
    startCommand: node server/realtime-server.mjs
    envVars:
      - key: NODE_ENV
        value: production
      # Logs prod en warn+ (le debug par requête noierait les erreurs sur Render gratuit)
      - key: LOG_LEVEL
        value: warn
      - key: PORT
        value: 4001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FEDAPAY_SECRET_KEY
        sync: false
      - key: ZOYD_ADMIN_PASSWORD
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: ZOYD_ALLOWED_ORIGINS
        value: "https://zoyd.vercel.app,https://zoyd.africa,https://www.zoyd.africa"
      # Email via API HTTPS (port 443 — SMTP bloqué sur Render gratuit).
      # Resend (recommandé) : https://resend.com/api-keys
      - key: RESEND_API_KEY
        sync: false
      # Alternative : Brevo https://app.brevo.com/settings/keys/api
      - key: BREVO_API_KEY
        sync: false
      # Expéditeur affiché (doit être vérifié chez le provider).
      - key: EMAIL_FROM
        sync: false
