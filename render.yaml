services:
  - type: web
    name: zoyd-backend
    env: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile --config.node-linker=hoisted
    startCommand: node server/realtime-server.mjs
    envVars:
      - key: NODE_ENV
        value: production
      # Un SEUL processus, explicitement.
      #
      # `docs/02-argent.md` affirmait que `WEB_CONCURRENCY=1` garantissait ça
      # « aujourd'hui » — alors que la variable n'était configurée NULLE PART.
      # La garantie ne tenait donc que par l'absence de `cluster` dans la
      # commande de démarrage : un concours de circonstances, pas une
      # configuration. Ajouter `--experimental-cluster`, ou passer Render à
      # l'autoscaling, cassait la garantie sans qu'aucune vérification ne bronche.
      - key: WEB_CONCURRENCY
        value: "1"
      # Logs prod en warn+ (le debug par requête noierait les erreurs sur Render gratuit)
      - key: LOG_LEVEL
        value: warn
      - key: PORT
        value: 4001
      # Le trafic arrive via le load balancer Render : on fait confiance au
      # X-Forwarded-For pour le rate-limit anti-bruteforce. Sans ça, si le
      # peer du LB n'est pas dans une plage privée, TOUS les utilisateurs
      # partagent un seul bucket (429 en série).
      - key: TRUST_PROXY
        value: "true"
      - key: SUPABASE_URL
        sync: false
        # PAS de SUPABASE_ANON_KEY : le code ne la lit pas, volontairement.
        # Tout passe par la cle service_role, qui contourne les RLS. Avec une
        # cle anon, chaque ecriture echouerait derriere un client pourtant
        # annonce actif. La garder ici ferait saisir une cle dans le tableau
        # de bord Render sans aucun effet.
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FEDAPAY_SECRET_KEY
        sync: false
      - key: ZOYD_ADMIN_PASSWORD
        sync: false
      # Identite du compte de moderation. Les valeurs par defaut du code
      # (admin@zoyd.com / ZOYD Control / admin-zoyd-control) sont publiques :
      # le depot est public, donc la cible du compte qui deplace de l'argent
      # est devinable. A surcharger AVANT de deploiement, avec un mot de passe
      # fort et different de tout autre service.
      - key: ZOYD_ADMIN_EMAIL
        sync: false
      - key: ZOYD_ADMIN_PSEUDO
        sync: false
      - key: ZOYD_ADMIN_ID
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: ZOYD_ALLOWED_ORIGINS
        value: "https://zoyd.vercel.app,https://zoyd.africa,https://www.zoyd.africa"
      # Email via API HTTPS (port 443 — SMTP bloqué sur Render gratuit).
      # Resend (recommandé) : https://resend.com/api-keys
      - key: RESEND_API_KEY
        sync: false
      # Alternative : Brevo https://app.brevo.com/settings/keys/api
      - key: BREVO_API_KEY
        sync: false
      # Expéditeur affiché (doit être vérifié chez le provider).
      - key: EMAIL_FROM
        sync: false
      # `/metrics` est protege par ce jeton (Bearer). SANS lui, la route
      # repond 403 : tout le systeme de metriques etait donc inexploite en
      # production, alors qu'il existe et tourne.
      - key: METRICS_TOKEN
        sync: false
