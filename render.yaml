services:
  - type: web
    name: zoyd-backend
    env: node
    plan: free
    buildCommand: pnpm install --config.node-linker=hoisted
    startCommand: node server/realtime-server.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FEDAPAY_SECRET_KEY
        sync: false
      - key: ZOYD_ADMIN_PASSWORD
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://zoyd.vercel.app,https://zoyd.africa,https://www.zoyd.africa"
